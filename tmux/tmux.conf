# ============================================================================
#  Prefix key (Ctrl+a)
# ============================================================================

# 修改 prefix 为 Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# ============================================================================
#  Indexing (start from 1)
# ============================================================================

set -g base-index 1          # window 编号从 1 开始
set -g pane-base-index 1     # pane 编号从 1 开始


# ============================================================================
#  Reload config (Ctrl+a r)
# ============================================================================

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"


# ============================================================================
#  Pane splitting (intuitive shortcuts)
# ============================================================================

# 默认分屏改为更直观的快捷键
bind '\' split-window -h      # 垂直分屏 (左右)
bind '-'  split-window -v     # 水平分屏 (上下)

# 取消默认分屏快捷键
unbind '"'
unbind '%'


# ============================================================================
#  Pane resizing (Ctrl+a + hjkl)
# ============================================================================

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# 无需 prefix 的 pane 切换 (Ctrl+hjkl)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# ============================================================================
#  Mouse & terminal
# ============================================================================

set -g mouse on                     # 鼠标支持
set -g status-interval 5            # 状态栏刷新时间
set -g default-terminal "screen-256color"   # 开启 256 色支持
set-option -a terminal-feature "$TERM:RGB"


# ============================================================================
#  Status bar
# ============================================================================

set -g status on

# 左侧：session + 当前目录
set -g status-left '[#[fg=black,bold]#S] #[fg=black]#{b:pane_current_path} '
set -g status-left-length 80

# 中间 window 列表
set -g status-justify centre
setw -g automatic-rename on

set -g window-status-format '#I:#W'
set -g window-status-current-format '#[reverse,bold] #I:#W '

# 右侧：日期时间
set -g status-right '#[fg=black]%Y-%m-%d %H:%M'
